name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            output_name: sqlparse-linux-x86_64
          - os: macos-latest
            output_name: sqlparse-macos-arm64
          - os: windows-latest
            output_name: sqlparse-windows-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Cache Nuitka downloads / bytecode
        uses: actions/cache@v4
        with:
          path: |
            .nuitka-cache
            ~/.cache/Nuitka
          key: nuitka-${{ matrix.os }}-${{ hashFiles('uv.lock', 'pyproject.toml', '.github/nuitka_build.sh') }}
          restore-keys: |
            nuitka-${{ matrix.os }}-

      - name: Setup ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-sqlparse-nuitka
          max-size: 2G

      - name: Install dependencies
        run: uv sync --frozen --compile-bytecode --no-dev

      - name: Build with Nuitka
        shell: bash
        run: |
          chmod +x .github/nuitka_build.sh
          ./.github/nuitka_build.sh

      - name: Zip artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x dist/sqlparse
          cd dist && zip -r ${{ matrix.output_name }}.zip sqlparse

      - name: Zip artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/sqlparse.exe -DestinationPath dist/${{ matrix.output_name }}.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}.zip
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract tag name
        id: tag_name
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: Release ${{ steps.tag_version.outputs.VERSION }}
          files: |
            artifacts/**/*.zip
          generate_release_notes: false
          draft: false
          prerelease: false
