[project]
name = "sqlparse"
version = "0.16.0"
description = "Index a SQLMesh project into a local sqlite database and query it over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.20",
    "fastmcp>=4.1.3",
    "nuitka[onefile]>=4.3.1",
    "pathspec>=1.1.1",
    "pyyaml>=6.0.2",
    "sqlmesh>=0.236.4",
    "xxhash>=4.0.2",
]

[dependency-groups]
dev = [
    "prek>=0.5.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures/"]
line-length = 100
force-exclude = true
lint.extend-select = [
    "A",     # Builtins
    "AIR",   # Optional: Airflow
    "FAST",  # Optional: FastApi
    "DTZ",   # Datetime
    "SIM",   # Simplify
    "I",     # Isort Imports
    "S",     # Bandit
    "PT",    # Pytest
    "B",     # BugBear
    "N",     # Naming Conventions
    "RUF",   # Ruff Specific Rules
    "PTH",   # Pathlib
    "ARG",   # Unused Args
    "C4",    # Force Current List Comprehensions
    "RET",   # Return Checks
    "E501",  # Line Too Long
    "ANN401" # No 'Any'
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "S607"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/fixtures/"]
